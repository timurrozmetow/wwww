# Production deploy for the backend control-plane (single VPS, ~10k installs).
# Run with the env file so ${...} interpolation AND the backend env_file agree:
#   docker compose --env-file deploy/.env.production -f docker-compose.prod.yml up -d --build
#
# DB and Redis are NOT published to the host — only Caddy is exposed (80/443),
# Caddy auto-provisions TLS for $DOMAIN and reverse-proxies to the backend.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vpn}
      MYSQL_USER: ${MYSQL_USER:-vpn}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # caching_sha2_password is the default in MySQL 8.x; the old
    # --default-authentication-plugin flag was REMOVED in 8.4 and crashes startup.
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF on — sessions, live balance, countdown, rate-limit & fraud counters must
    # survive a restart (CLAUDE.md §14.3).
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      # Service-internal endpoints — override anything in the env file so there's
      # one source of truth for where the DB/Redis live.
      DATABASE_URL: mysql://${MYSQL_USER:-vpn}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-vpn}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
